<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iqbaal Chicken Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="intro">
  <div class="egg">🐔</div>
  <p>IQBAAL THE RAIL MINISTOR🎁</p>
  <button id="tapBtn">👆 TAP — Iqbaal Chicken Shop</button>
</div>

<div id="scene">
  <div class="sun"></div>
  <div class="cloud" style="top:8%;animation-duration:38s">☁️</div>
  <div class="cloud" style="top:20%;animation-duration:55s;animation-delay:-20s;font-size:44px">☁️</div>

  <div class="shop">
    <div class="sign"><span id="shopName">IQBAAL CHICKEN SHOP</span><small>★ FRESH &amp; TASTY ★</small></div>
    <div class="awning"></div>
    <div class="wall">
      <div class="board"><b>MENU</b>🍗 Fry<br>🔥 Tandoori<br>🍖 Grill</div>
      <div class="frameBox" id="frameBox">
        <div class="frame"><div class="ph" id="ph">📷<br>Tap karke<br>photo lagao</div></div>
        <span class="tag" id="friendTag">hii guys</span>
      </div>
      <div class="open">OPEN<br>24x7</div>
    </div>
    <div class="counter"><span>🍗</span><span>🍗</span><span>🥘</span><span>🍗</span><span>🍗</span></div>
  </div>

  <div class="ground" id="ground"></div>
  <div class="msg" id="msg"></div>
  <input type="file" id="photoInput" accept="image/*">
</div>

<!-- Chicken drawing (reused) -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="chicken" viewBox="0 0 100 100">
      <path d="M22 52 Q0 34 8 22 Q22 30 30 48Z" fill="var(--c)"/>
      <ellipse cx="46" cy="58" rx="31" ry="24" fill="var(--c)"/>
      <ellipse cx="42" cy="60" rx="17" ry="11" fill="var(--w)"/>
      <circle cx="78" cy="34" r="14" fill="var(--c)"/>
      <circle cx="70" cy="19" r="5" fill="#e53935"/><circle cx="78" cy="16" r="5.5" fill="#e53935"/><circle cx="86" cy="19" r="4.5" fill="#e53935"/>
      <polygon points="90,32 101,37 90,42" fill="#ff9800"/>
      <ellipse cx="88" cy="47" rx="4" ry="6" fill="#e53935"/>
      <circle cx="82" cy="31" r="3" fill="#222"/><circle cx="83" cy="30" r="1" fill="#fff"/>
      <g stroke="#ff9800" stroke-width="3.5" stroke-linecap="round" fill="none">
        <path d="M40 80V93M34 94H46"/><path d="M56 80V93M50 94H62"/>
      </g>
    </symbol>
  </defs>
</svg>

<script src="script.js"></script>
</body>
</html>
